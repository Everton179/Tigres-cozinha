
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigres Food - Painel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
body{background:#030562;color:#f8fafc;min-height:100vh}
header{background:#080b10;border-bottom:1px solid #303946;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 6px 22px #0005}
.logo{font-size:23px;font-weight:800;color:#60a5fa;letter-spacing:.5px}
.logo span{color:#fff}
.cozinha{color:#aab6c5;font-size:13px;font-weight:700;letter-spacing:1.4px}
.container{width:92%;max-width:1200px;margin:32px auto}
.entrada{background:#f8fafc;color:#182230;border:1px solid #d5dde7;border-radius:16px;padding:25px;margin-bottom:32px;box-shadow:0 10px 28px #0003}
.entrada h2{color:#111827;font-size:21px;margin-bottom:10px}
.entrada p{color:#050505;font-size:15px;line-height:1.6;margin-bottom:18px}
textarea{width:100%;min-height:160px;resize:vertical;background:#fff;color:#090909;border:2px solid #070707;border-radius:10px;padding:16px;outline:none;font-size:14px;line-height:1.6;transition:.2s}
textarea::placeholder{color:#7a8797}
textarea:focus{border-color:#3478d4;box-shadow:0 0 0 3px #3478d422}
button{font-family:inherit}
.btn-organizar{margin-top:14px;width:100%;padding:14px;border:2px solid #080808;border-radius:9px;background:#5091ec;color:#fff;font-weight:750;font-size:14px;cursor:pointer;transition:.2s}
.btn-organizar:hover{background:#141bcf;transform:translateY(-1px)}
.titulo-pedidos{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.titulo-pedidos h2{font-size:22px;font-weight:800}
.contador{background:#202a37;border:1px solid #39485b;color:#dbeafe;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:800}
#pedidos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;align-items:start}
.pedido{background:#f8fafc;color:#182230;border:1px solid #d5dde7;border-radius:14px;padding:20px;box-shadow:0 7px 22px #0003;transition:.2s}
.pedido:hover{border-color:#6b9fe2;transform:translateY(-2px);box-shadow:0 12px 28px #0004}
.pedido.novo{border-color:#3478d4;box-shadow:0 0 0 1px #3478d41f,0 8px 24px #0003}
.pedido.preparando{border-color:#2563EB}
.pedido.pronto{border-color:#16A34A}
.pedido.entregue{border-color:#64748b;opacity:.85}
.pedido-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.numero{font-size:18px;font-weight:800;color:#111827;overflow-wrap:anywhere}
.dados-cliente{font-size:18px;font-weight:800;color:#111827;overflow-wrap:anywhere}
.dados-mesa{font-size:14px;font-weight:700;margin-top:5px;color:#475569}
.status{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.6px;padding:7px 10px;border-radius:6px;background:#e7f0fc;color:#245a9f;border:1px solid #c8dcf6}
.preparando .status{background:#dbeafe;color:#1e4e8c}
.pronto .status{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.entregue .status{background:#e5e7eb;color:#374151;border-color:#cbd5e1}
.itens{border-top:1px solid #dce2e9;border-bottom:1px solid #dce2e9;padding:13px 0;margin-bottom:16px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;font-size:14px;color:#354254;line-height:1.5}
.item strong{color:#245fae;margin-right:5px}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px;font-weight:800;color:#182230;margin-bottom:15px}
.total span:last-child{color:#245fae}
.pagamento,.observacao{border-radius:9px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:12px}
.pagamento{background:#0a0a0a;border:1px solid #dbe2eb;color:#f3f3f3}
.observacao{background:#111;border:1px solid #dbe2eb;color:#f1f1f1;margin-bottom:17px}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acoes button{border:1px solid transparent;padding:11px 6px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;transition:.2s}
.acoes button:hover{transform:translateY(-1px)}
.btn-preparar{background:#2563EB;color:#fff;border:1px solid #1D4ED8!important}
.btn-preparar:hover{background:#072372}
.btn-pronto{background:#34e174;color:#fff;border:1px solid #15803D!important}
.btn-pronto:hover{background:#126e34}
.btn-entregue{background:#6d6b6b;color:#fff;border:1px solid #334155!important}
.btn-entregue:hover{background:#0e0e0e}
.btn-salvar{background:#8f52f9;color:#fff;border:1px solid #6D28D9!important}
.btn-salvar:hover{background:#330283}
.btn-liberar{background:#15803d!important;color:white}
.vazio{text-align:center;color:#526176;padding:50px 20px;border:2px dashed #64748b;border-radius:14px;background:#f0f1f3;grid-column:1/-1;line-height:1.7}
.login-box{width:92%;max-width:430px;margin:55px auto;padding:28px;background:#f8fafc;color:#182230;border:1px solid #d5dde7;border-radius:16px;box-shadow:0 10px 28px #0004}
.login-box h2{margin-bottom:10px;color:#111827}
.login-box p{margin-bottom:18px;line-height:1.5;color:#475569}
.login-box input{width:100%;padding:13px;margin-bottom:12px;border:1px solid #94a3b8;border-radius:8px;font-size:15px}
.login-box button,.btn-sair{padding:13px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:800;cursor:pointer}
.login-box button{width:100%}
.btn-sair{background:#334155;padding:9px 13px}
.mensagem-login{margin-top:12px;font-size:13px;overflow-wrap:anywhere;color:#b91c1c}
.area-usuario{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 5%;background:#080b10;color:#dbeafe;font-size:13px}
@media(max-width:600px){
 header{padding:16px 5%}
 .logo{font-size:19px}
 .cozinha{font-size:10px;letter-spacing:.5px}
 .container{width:92%;margin:22px auto}
 .entrada{padding:18px}
 .titulo-pedidos h2{font-size:19px}
 #pedidos{grid-template-columns:1fr;gap:15px}
 .pedido{padding:17px}
 .area-usuario{flex-wrap:wrap}
}
</style>
</head>

<body>
<header>
    <div class="logo">🐯 TIGRES <span>FOOD</span></div>
    <div class="cozinha" id="tituloPainel">PAINEL DE ACESSO</div>
</header>

<div class="area-usuario" id="areaUsuario" style="display:none">
    <span id="identificacaoUsuario"></span>
    <button type="button" class="btn-sair" id="botaoSair">Sair do painel</button>
</div>

<div class="login-box" id="loginBox">
    <h2>🐯 Acesso ao Tigres Food</h2>
    <p>Entre com seu e-mail e senha autorizados.</p>
    <form id="formLogin">
        <input type="email" id="emailLogin" placeholder="Seu e-mail" autocomplete="username" required>
        <input type="password" id="senhaLogin" placeholder="Sua senha" autocomplete="current-password" required>
        <button type="submit">Entrar no painel</button>
    </form>
    <div class="mensagem-login" id="mensagemLogin"></div>
</div>

<div class="container" id="appContainer" style="display:none">
    <div class="entrada" id="entradaPedido">
        <h2>📥 Receber pedido</h2>
        <p>Cole a mensagem recebida no WhatsApp. Depois de cadastrar, confirme o pagamento para liberar o pedido à cozinha.</p>
        <textarea id="mensagem" placeholder="Cole aqui a mensagem do WhatsApp..."></textarea>
        <button class="btn-organizar" id="botaoOrganizar">🐯 CADASTRAR PEDIDO</button>
    </div>

    <div class="titulo-pedidos">
        <h2 id="tituloPedidos">📋 Pedidos</h2>
        <div class="contador" id="contador">0 pedidos</div>
    </div>

    <div id="pedidos">
        <div class="vazio">Carregando pedidos...</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCS5gKfwC5LA6HYtwZEs9lm6Qu54QVC0Qw",
    authDomain: "tigres-food.firebaseapp.com",
    projectId: "tigres-food",
    storageBucket: "tigres-food.firebasestorage.app",
    messagingSenderId: "374947589802",
    appId: "1:374947589802:web:db70442bc08353a45b2ad3",
    measurementId: "G-N4NZ03TM9R"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const UID_FINANCEIRO = "VVFpmKhVwZUnZA2o1YTOyb18JbF2";
const UID_COZINHA = "i9rSG8E5wONyBjmZzsJLJCubzzd2";

let usuarioAtual = null;
let funcaoAtual = null;
let pararPedidos = null;

const $ = id => document.getElementById(id);

function escaparHTML(texto) {
    return String(texto ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
}

function dinheiro(valor) {
    return Number(valor || 0).toLocaleString("pt-BR", {
        style:"currency",currency:"BRL"
    });
}

function mensagemErroFirebase(erro) {
    console.error(erro);
    $("mensagemLogin").textContent =
        "Não foi possível concluir. Confira o acesso e as regras do Firebase.";
}

$("formLogin").addEventListener("submit", async e => {
    e.preventDefault();
    $("mensagemLogin").textContent = "Verificando acesso...";

    try {
        await auth.signInWithEmailAndPassword(
            $("emailLogin").value.trim(),
            $("senhaLogin").value
        );
        $("senhaLogin").value = "";
    } catch (erro) {
        $("mensagemLogin").textContent =
            "Não foi possível entrar. Confira o e-mail e a senha.";
        console.error(erro);
    }
});

$("botaoSair").addEventListener("click", () => auth.signOut());
$("botaoOrganizar").addEventListener("click", organizarPedido);

auth.onAuthStateChanged(async usuario => {
    usuarioAtual = usuario;
    funcaoAtual = null;

    if (pararPedidos) {
        pararPedidos();
        pararPedidos = null;
    }

    if (!usuario) {
        $("loginBox").style.display = "block";
        $("appContainer").style.display = "none";
        $("areaUsuario").style.display = "none";
        $("tituloPainel").textContent = "PAINEL DE ACESSO";
        $("mensagemLogin").textContent = "";
        return;
    }

    if (usuario.uid === UID_FINANCEIRO) {
        funcaoAtual = "financeiro";
    } else if (usuario.uid === UID_COZINHA) {
        funcaoAtual = "cozinha";
    } else {
        await auth.signOut();
        $("mensagemLogin").textContent = "Este usuário não tem permissão para acessar.";
        return;
    }

    $("loginBox").style.display = "none";
    $("appContainer").style.display = "block";
    $("areaUsuario").style.display = "flex";

    $("tituloPainel").textContent = funcaoAtual === "financeiro"
        ? "PAINEL DO FINANCEIRO" : "PAINEL DA COZINHA";

    $("identificacaoUsuario").textContent = funcaoAtual === "financeiro"
        ? "Acesso: Financeiro" : "Acesso: Cozinha";

    $("entradaPedido").style.display =
        funcaoAtual === "financeiro" ? "block" : "none";

    $("tituloPedidos").textContent = funcaoAtual === "financeiro"
        ? "📋 Pedidos e pagamentos" : "🍳 Pedidos liberados para preparo";

    ouvirPedidos();
});

function ouvirPedidos() {
    const lista = $("pedidos");
    lista.innerHTML = '<div class="vazio">Carregando pedidos...</div>';

    let consulta = db.collection("pedidos");

    if (funcaoAtual === "cozinha") {
        consulta = consulta.where("liberado", "==", true);
    }

    pararPedidos = consulta.onSnapshot(snapshot => {
        lista.innerHTML = "";

        if (snapshot.empty) {
            lista.innerHTML = `<div class="vazio">Nenhum pedido disponível neste momento.</div>`;
            $("contador").textContent = "0 pedidos";
            return;
        }

        const pedidos = snapshot.docs.map(doc => ({id:doc.id,...doc.data()}));

        pedidos.sort((a,b) =>
            (a.criadoEm?.toMillis?.() || 0) - (b.criadoEm?.toMillis?.() || 0)
        );

        pedidos.forEach(p => lista.appendChild(montarCartao(p)));

        const ativos = pedidos.filter(p =>
            funcaoAtual === "financeiro"
                ? p.pagamentoStatus !== "confirmado"
                : p.statusCozinha !== "entregue"
        ).length;

        $("contador").textContent =
            ativos + (ativos === 1 ? " pedido pendente" : " pedidos pendentes");
    }, erro => {
        console.error(erro);
        lista.innerHTML = `<div class="vazio">Erro ao carregar pedidos. Confira as regras do Firestore.</div>`;
    });
}

function montarCartao(p) {
    const card = document.createElement("div");
    const status = p.statusCozinha || "novo";
    card.className = "pedido " + status;

    const itensHTML = (Array.isArray(p.itens) ? p.itens : []).map(item => `
        <div class="item">
            <span><strong>${escaparHTML(item.quantidade)}x</strong> ${escaparHTML(item.nome)}</span>
            <span>${dinheiro(item.preco)}</span>
        </div>
    `).join("");

    const statusTexto = {
        novo:"NOVO",preparando:"PREPARANDO",pronto:"PRONTO",entregue:"ENTREGUE"
    }[status] || "NOVO";

    let botoes = "";

    if (funcaoAtual === "financeiro") {
        botoes = p.liberado
            ? `<div class="observacao">✅ Pagamento confirmado. Pedido liberado para a cozinha.</div>`
            : `<div class="observacao">⏳ Pagamento aguardando confirmação.</div>
               <button type="button" class="btn-organizar btn-liberar" data-acao="liberar">
               💳 Confirmar pagamento e liberar pedido</button>`;
    } else {
        botoes = `
            <div class="acoes">
                <button class="btn-preparar" data-acao="preparando">🍳 Preparar</button>
                <button class="btn-pronto" data-acao="pronto">✅ Pronto</button>
                <button class="btn-entregue" data-acao="entregue">📦 Entregue</button>
                <button type="button" class="btn-salvar">✓ Finalizar e salvar pedido</button>
            </div>`;
    }

    card.innerHTML = `
        <div class="pedido-topo">
            <div>
                <div class="numero">Pedido ${escaparHTML(p.numero || p.id)}</div>
                <div class="dados-cliente">${escaparHTML(p.nomeCliente)}</div>
                <div class="dados-mesa">Mesa ${escaparHTML(p.mesa)}</div>
            </div>
            <div class="status">${statusTexto}</div>
        </div>
        <div class="itens">${itensHTML}</div>
        <div class="total"><span>Total</span><span>${dinheiro(p.total)}</span></div>
        <div class="pagamento">💰 <strong>Pagamento:</strong> ${p.pagamentoStatus === "confirmado" ? "Confirmado" : "A confirmar"}</div>
        ${p.observacao ? `<div class="observacao">📝 ${escaparHTML(p.observacao)}</div>` : ""}
        ${botoes}
    `;

    card.querySelectorAll("[data-acao]").forEach(botao => {
        botao.addEventListener("click", () => executarAcao(p, botao.dataset.acao));
    });

    return card;
}

async function executarAcao(pedido, acao) {
    const ref = db.collection("pedidos").doc(pedido.id);

    try {
        if (acao === "liberar") {
            if (funcaoAtual !== "financeiro") {
                alert("Somente o financeiro pode liberar pedidos.");
                return;
            }

            if (!confirm("Confirma que o pagamento foi recebido?")) return;

            await ref.update({
                pagamentoStatus:"confirmado",
                liberado:true
            });

            alert("Pagamento confirmado e pedido liberado para a cozinha!");
            return;
        }

        if (funcaoAtual !== "cozinha") {
            alert("Somente a cozinha pode atualizar o preparo.");
            return;
        }

        if (!["preparando","pronto","entregue"].includes(acao)) return;

        await ref.update({statusCozinha:acao});
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível salvar. Confira as regras do Firestore.");
    }
}

async function organizarPedido() {
    if (funcaoAtual !== "financeiro") {
        alert("Somente o financeiro pode cadastrar pedidos.");
        return;
    }

    const texto = $("mensagem").value.trim();
    if (!texto) {
        alert("Cole a mensagem do WhatsApp primeiro.");
        return;
    }

    const linhas = texto.split(/\r?\n/);
    const linhaCliente = linhas.find(l =>
        /^(nome do cliente|cliente|nome)\s*:/i.test(l.trim())
    );
    const linhaMesa = linhas.find(l =>
        /^(número da mesa|numero da mesa|mesa)\s*:/i.test(l.trim())
    );

    const nomeCliente = linhaCliente
        ? linhaCliente.replace(/^(nome do cliente|cliente|nome)\s*:/i,"").trim() : "";
    const mesa = linhaMesa
        ? linhaMesa.replace(/^(número da mesa|numero da mesa|mesa)\s*:/i,"").trim() : "";

    if (!nomeCliente || !mesa) {
        alert("A mensagem precisa conter:\nNome do cliente: Maria Silva\nMesa: 04");
        return;
    }

    const sabores = [
        "pastel de pizza",
        "pastel de frango com catupiry",
        "pastel de carne com queijo",
        "pastel de nutella"
    ];

    const itens = [];
    let total = 0;

    linhas.forEach(linha => {
        if (!sabores.some(s => linha.toLowerCase().includes(s))) return;

        const partes = linha.split("|");
        if (partes.length < 3) return;

        const nome = partes[0].replace("•","").trim();
        const quantidade = parseInt(
            partes[1].replace(/Quantidade:/i,"").trim(),10
        );
        const preco = parseFloat(
            partes[2].replace(/R\$/i,"").trim()
                .replace(/\./g,"").replace(",",".")
        );

        if (nome && Number.isInteger(quantidade) && quantidade > 0 &&
            Number.isFinite(preco) && preco >= 0) {
            itens.push({nome,quantidade,preco});
            total += preco;
        }
    });

    if (!itens.length) {
        alert("Não encontrei os pastéis. Exemplo:\n• Pastel de Pizza | Quantidade: 2 | R$ 20,00");
        return;
    }

    const linhaTotal = linhas.find(l => /^total\s*:/i.test(l.trim()));
    if (linhaTotal) {
        const m = linhaTotal.match(/R\$\s*([\d.,]+)/);
        if (m) total = parseFloat(m[1].replace(/\./g,"").replace(",","."));
    }

    try {
        await db.collection("pedidos").add({
            numero:String(Date.now()).slice(-6),
            nomeCliente,
            mesa,
            itens,
            total,
            pagamentoStatus:"pendente",
            liberado:false,
            statusCozinha:"novo",
            observacao:"Pedido recebido pelo WhatsApp.",
            criadoPor:usuarioAtual.uid,
            criadoEm:firebase.firestore.FieldValue.serverTimestamp()
        });

        $("mensagem").value = "";
        alert("Pedido cadastrado! Confirme o pagamento para liberar à cozinha.");
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível cadastrar. Confira as regras do Firestore.");
    }
}
</script>
</body>
</html>
